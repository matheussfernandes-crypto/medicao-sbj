/* ===== SELETORES NO PADRÃO DA VISTORIAS ===== O select nativo continua no lugar (escondido e com o valor);
   a caixa e a lista são desenhadas aqui, com animação. Escolher uma opção grava no select e avisa "change". */
(function () {
  var css =
    ".sel-w{position:relative;display:inline-block;vertical-align:middle;max-width:100%}" +
    ".sel-w.bloco{display:block;width:100%}" +
    ".sel-b{position:relative;width:100%;min-height:40px;padding:8px 36px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s ease,box-shadow .2s ease}" +
    ".sel-b::after{content:\"\";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.7px solid var(--muted);border-bottom:1.7px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .25s cubic-bezier(.22,1,.36,1)}" +
    ".sel-w.aberto .sel-b::after{transform:translateY(-30%) rotate(225deg)}" +
    ".sel-b:focus-visible,.sel-w.aberto .sel-b{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,104,122,.15)}" +
    ".sel-l{position:absolute;left:0;top:calc(100% + 6px);min-width:max(100%,240px);max-width:min(360px,88vw);max-height:300px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;transform-origin:top left;opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .18s ease,transform .22s cubic-bezier(.22,1,.36,1)}" +
    ".sel-w.aberto .sel-l{opacity:1;transform:none;pointer-events:auto}" +
    ".sel-o{white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;color:var(--fg);text-align:left;cursor:pointer;transition:background .15s ease,color .15s ease}" +
    ".sel-o:hover,.sel-o:focus-visible{background:var(--accent-soft);outline:none}" +
    ".sel-o.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}" +
    ".sel-o.on::after{content:\"✓\";font-size:13px}" +
    "select[data-sel-c]{display:none!important}";
  var st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);

  function fecha(except) {
    document.querySelectorAll(".sel-w.aberto").forEach(function (w) {
      if (w !== except) w.classList.remove("aberto");
    });
  }
  function rotula(sel, b) {
    var o = sel.options[sel.selectedIndex];
    b.textContent = o ? o.textContent : "";
  }
  function monta(sel) {
    sel.dataset.selC = "1";
    var bloco = sel.parentElement && sel.getBoundingClientRect().width >= sel.parentElement.getBoundingClientRect().width - 8;
    var w = document.createElement("span");
    w.className = "sel-w" + (bloco ? " bloco" : "");
    if (sel.style.width) w.style.width = sel.style.width;
    if (sel.style.maxWidth) w.style.maxWidth = sel.style.maxWidth;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sel-b";
    b.setAttribute("aria-haspopup", "listbox");
    var l = document.createElement("div");
    l.className = "sel-l";
    l.setAttribute("role", "listbox");
    sel.parentNode.insertBefore(w, sel);
    w.appendChild(b);
    w.appendChild(l);
    w.appendChild(sel);
    rotula(sel, b);
    b.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var abrir = !w.classList.contains("aberto");
      fecha();
      if (!abrir) return;
      l.innerHTML = "";
      Array.prototype.forEach.call(sel.options, function (o, i) {
        var x = document.createElement("button");
        x.type = "button";
        x.className = "sel-o" + (i === sel.selectedIndex ? " on" : "");
        x.setAttribute("role", "option");
        x.textContent = o.textContent;
        x.addEventListener("click", function (ev) {
          ev.stopPropagation();
          sel.value = o.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          rotula(sel, b);
          w.classList.remove("aberto");
        });
        l.appendChild(x);
      });
      w.classList.add("aberto");
      var on = l.querySelector(".on");
      if (on) on.scrollIntoView({ block: "nearest" });
    });
  }
  function varre() {
    Array.prototype.forEach.call(document.querySelectorAll("select"), function (sel) {
      if (!sel.dataset.selC && sel.parentNode) monta(sel);
    });
    Array.prototype.forEach.call(document.querySelectorAll("select[data-sel-c]"), function (sel) {
      var w = sel.parentElement;
      var b = w && w.querySelector(".sel-b");
      if (b) rotula(sel, b);
    });
  }
  var agendado = false;
  function agendar() {
    if (agendado) return;
    agendado = true;
    requestAnimationFrame(function () {
      agendado = false;
      varre();
    });
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".sel-w")) fecha();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") fecha();
  });
  new MutationObserver(agendar).observe(document.body, { childList: true, subtree: true });
  agendar();
})();
/* relatório: recolher a lista e filtrar as linhas (sem redesenhar, para não perder o foco do campo) */
(function(){
  function filtra(sec){
    const un=(sec.querySelector('[data-col="un"]')||{}).value||'';
    const pb=(sec.querySelector('[data-col="pb"]')||{}).value||'';
    const st=(sec.querySelector('[data-col="st"]')||{}).value||'';
    const u=un.trim().toLowerCase(), p=pb.trim().toLowerCase();
    sec.querySelectorAll('tbody tr').forEach(function(tr){
      const ok=(!u||(tr.dataset.un||'').includes(u))&&(!p||(tr.dataset.pb||'').includes(p))&&(!st||tr.dataset.st===st);
      tr.classList.toggle('rel-oculta',!ok);
    });
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest&&e.target.closest('[data-rel-toggle]');
    if(!b)return;
    const sec=b.closest('.rel-sec');
    sec.classList.toggle('fechado');
    b.setAttribute('aria-expanded',sec.classList.contains('fechado')?'false':'true');
    const tx=b.querySelector('.rel-toggle-t');if(tx)tx.textContent=sec.classList.contains('fechado')?'Mostrar':'Recolher';
    b.setAttribute('aria-label',sec.classList.contains('fechado')?'Mostrar a lista':'Recolher a lista');b.title=b.getAttribute('aria-label');
  });
  document.addEventListener('input',function(e){
    const c=e.target;
    if(c.classList&&c.classList.contains('rel-f')){const sec=c.closest('.rel-sec');if(sec)filtra(sec);}
  });
  document.addEventListener('change',function(e){
    const c=e.target;
    if(c.classList&&c.classList.contains('rel-f')){const sec=c.closest('.rel-sec');if(sec)filtra(sec);}
  });
})();

/* campo de mês do site e calendários que nunca saem da tela */
(function(){
  var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  function hoje(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
  function rotulo(v){if(!v)return "Escolher o mês";var p=v.split("-");var s=new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
  function fechaTodos(exceto){document.querySelectorAll(".mes-w.aberto").forEach(function(w){if(w!==exceto)w.classList.remove("aberto")})}
  function monta(inp){
    inp.dataset.mesC="1";
    var w=document.createElement("span");w.className="mes-w";
    var b=document.createElement("button");b.type="button";b.className="mes-b";
    var p=document.createElement("div");p.className="mes-p";p.setAttribute("role","dialog");p.setAttribute("aria-label","Escolher o mês");
    inp.parentNode.insertBefore(w,inp);w.appendChild(b);w.appendChild(p);w.appendChild(inp);
    var ano=+((inp.value||hoje()).slice(0,4));
    function pinta(){b.innerHTML='<span>'+rotulo(inp.value)+'</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>'}
    function escolhe(v){inp.value=v;pinta();w.classList.remove("aberto");inp.dispatchEvent(new Event("change",{bubbles:true}))}
    function grade(){
      var h=hoje();
      p.innerHTML='<div class="mes-h"><button type="button" data-d="-1" aria-label="Ano anterior">‹</button><b>'+ano+'</b><button type="button" data-d="1" aria-label="Próximo ano">›</button></div><div class="mes-g">'+
        MESES.map(function(m,i){var v=ano+"-"+String(i+1).padStart(2,"0");return '<button type="button" data-v="'+v+'" class="'+(v===inp.value?"on":v===h?"hoje":"")+'">'+m+'</button>'}).join("")+
        '</div><div class="mes-f"><button type="button" data-v="">Limpar</button><button type="button" class="pri" data-v="'+h+'">Este mês</button></div>';
    }
    p.addEventListener("click",function(e){e.stopPropagation();var x=e.target.closest("button");if(!x)return;if(x.dataset.d){ano+=+x.dataset.d;grade();return}if("v" in x.dataset)escolhe(x.dataset.v)});
    b.addEventListener("click",function(e){e.stopPropagation();var abrir=!w.classList.contains("aberto");fechaTodos();if(!abrir)return;ano=+((inp.value||hoje()).slice(0,4));grade();w.classList.add("aberto");cabe(p)});
    pinta();
  }
  // empurra a janelinha para dentro da tela (telas menores, como notebook)
  function cabe(el){
    el.style.marginLeft="";
    requestAnimationFrame(function(){
      var r=el.getBoundingClientRect(),m=8,dx=0;
      if(r.right>innerWidth-m)dx=innerWidth-m-r.right;
      if(r.left+dx<m)dx=m-r.left;
      if(dx)el.style.marginLeft=dx+"px";
    });
  }
  function varre(){
    document.querySelectorAll("input[data-mes]").forEach(function(inp){if(!inp.dataset.mesC)monta(inp)});
    document.querySelectorAll(".ag-cal").forEach(function(c){if(!c.dataset.cabe){c.dataset.cabe="1";cabe(c)}});
  }
  var ag=false;function agendar(){if(ag)return;ag=true;requestAnimationFrame(function(){ag=false;varre()})}
  document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest(".mes-w"))fechaTodos()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")fechaTodos()});
  addEventListener("resize",function(){document.querySelectorAll(".ag-cal").forEach(cabe)});
  new MutationObserver(agendar).observe(document.body,{childList:true,subtree:true});
  agendar();
})();

    });return}
  if(a==="sync"){b.disabled=true;b.textContent="Sincronizando…";gAgSincroniza(true).then(function(j){
    toast(j.ok?(j.gravados||j.apagados?"Google Agenda atualizado":"Google Agenda já estava em dia"):"Não deu para atualizar: "+(j.erro||"tente de novo"));
    S.gAg=undefined;S.gAgSyncEm=Date.now();gAgCarrega();});return}
  if(a==="sair"){
    if(!confirm("Desconectar do Google Agenda?\n\nO site para de mandar as visitas para o seu Google. Os eventos que já estão lá continuam. Nada do site é apagado."))return;
    b.disabled=true;fetch("/api/google-agenda/desconectar",{method:"POST"}).then(function(){S.gAgAberto=false;S.gAg=undefined;gAgCarrega();toast("Google Agenda desconectado")});return;
  }
});
/* volta da tela do Google: avisa como foi e limpa o endereço */
(function(){
  try{
    var w=window.top||window;var q=new URLSearchParams(w.location.search);var r=q.get("google");if(!r)return;
    var M={ok:"Google Agenda conectado de novo.",escolher:"Google conectado. Agora escolha em qual agenda as visitas vão entrar.",cancelado:"Ligação com o Google cancelada.","sem-permissao":"Faltou marcar a permissão da agenda na tela do Google. Tente de novo.","sem-acesso":"A ligação com o Google é só para o setor de arquitetura.","nao-configurado":"A ligação com o Google ainda não foi ativada. Fale com o Matheus.",erro:"Não deu para conectar ao Google. Tente de novo."};
    setTimeout(function(){toast(M[r]||M.erro)},600);
    if(r==="ok"||r==="escolher")S.gAgAberto=true;
    q.delete("google");w.history.replaceState(null,"",w.location.pathname+(q.toString()?"?"+q:"")+w.location.hash);
  }catch(e){}
})();
/* ---- Registro rápido: a caixa de texto cresce com o conteúdo ---- */
function qAuto(){const ta=document.getElementById("q-text");if(!ta)return;ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight+2,Math.round(window.innerHeight*0.6))+"px"}
document.addEventListener("input",function(e){if(e.target&&e.target.id==="q-text")qAuto()});
setInterval(function(){var ta=document.getElementById("q-text");if(ta&&ta._n!==ta.value.length){ta._n=ta.value.length;qAuto()}},300);

/* ---- cargos: adicionar / remover da lista (só a lista; visitas já marcadas guardam o cargo escolhido) ---- */
document.addEventListener("click",async function(e){
  const b=e.target.closest&&e.target.closest("[data-ca]");if(!b)return;
  const l=cargosLista();
  try{
    if(b.dataset.ca==="add"){const inp=document.getElementById("cargo-novo");const n=(inp&&inp.value||"").trim();if(!n)return;
      if(l.some(c=>norm(c)===norm(n)))return toast("Esse cargo já existe.");
      await saveCfg({cargos:[...l,n]});toast("Cargo adicionado")}
    else if(b.dataset.ca==="del"){await saveCfg({cargos:l.filter(c=>c!==b.dataset.v)});toast("Cargo removido da lista")}
    scheduleRender();
  }catch(err){dbErr(err)}
});

init();
</script>
