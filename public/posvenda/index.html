<title>Central Pós-Venda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral + área de trabalho; no celular, navegação inferior fixa. Identidade SBJ: azul-petróleo #00687A, amarelo #F2E400 em detalhes. */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#E1E9EB; --line:#CFDBDE; --fg:#14242A; --muted:#55676D;
  --accent:#00687A; --accent-fg:#FFFFFF; --accent-soft:#D5EAEE; --brand-y:#F2E400; --brand-y-soft:#FBF7C2;
  --ok:#2C7A4B; --ok-soft:#DCEFE2; --warn:#A66300; --warn-soft:#F6E7CF; --bad:#B3261E; --bad-soft:#F7DEDB; --info:#2F57B0; --info-soft:#DEE6F7;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 24px rgba(20,30,25,.08);
  --f-display:"Nunito",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1517; --surface:#152023; --surface-2:#1D2B2F; --line:#2A3A3F; --fg:#E4EEF0; --muted:#93A7AC;
  --accent:#3DB4C6; --accent-fg:#06161A; --accent-soft:#0F3038; --brand-y:#E8DA1C; --brand-y-soft:#33300C;
  --ok:#62C48D; --ok-soft:#173023; --warn:#E3A44A; --warn-soft:#352813; --bad:#F2766D; --bad-soft:#3A1A18; --info:#86A6F2; --info-soft:#1B2540;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1517; --surface:#152023; --surface-2:#1D2B2F; --line:#2A3A3F; --fg:#E4EEF0; --muted:#93A7AC;
  --accent:#3DB4C6; --accent-fg:#06161A; --accent-soft:#0F3038; --brand-y:#E8DA1C; --brand-y-soft:#33300C;
  --ok:#62C48D; --ok-soft:#173023; --warn:#E3A44A; --warn-soft:#352813; --bad:#F2766D; --bad-soft:#3A1A18; --info:#86A6F2; --info-soft:#1B2540;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:27px;font-weight:900;color:var(--accent)}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:800}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px;border-bottom:3px solid var(--brand-y)}
.brand>div{display:flex;flex-direction:column;gap:1px}
.brand-logo{width:52px;height:52px;border-radius:12px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:900;letter-spacing:-.01em;color:var(--accent)}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--brand-y)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--surface-2);color:var(--fg);padding:1px 7px;border-radius:99px}
.side .foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .sub{color:var(--muted);margin-top:4px}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;cursor:pointer;border-radius:8px}
  .bnav button svg{width:20px;height:20px}
  .bnav button[aria-current="page"]{color:var(--accent);font-weight:600}
  h1{font-size:22px}
}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.wa{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.btn.done{background:var(--surface-2);border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.grid-main,.grid2{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-info{background:var(--info-soft);color:var(--info)} .c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-accent{background:var(--accent-soft);color:var(--accent)} .c-mut{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;background:var(--surface-2);font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:15px;margin-bottom:4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--fg);min-width:0}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (max-width:640px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.s1{grid-column:span 1}.s2,.s3,.s4,.s6{grid-column:span 2}}
.sep{height:1px;background:var(--line);margin:4px 0}
.banner{padding:10px 14px;border-radius:8px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}

/* registro rápido */
.quick{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.quick-h{padding:16px 18px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.quick textarea{display:block;width:100%;border:0;background:transparent;padding:12px 18px;min-height:120px;resize:vertical;line-height:1.5;font-size:15px}
.quick textarea:focus{outline:none}
.quick-partial{padding:0 18px;color:var(--muted);font-style:italic;min-height:0}
.quick-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.quick-bar .grow{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px;line-height:20px;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.status-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.review{border:1px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 4px var(--accent-soft)}
.doubt{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .num{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:42px}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.prio-urgente{color:var(--bad);font-weight:700}
.prio-alta{color:var(--warn);font-weight:600}
.todo{display:flex;flex-direction:column;gap:10px}
.todo-i{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.todo-i .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* tabela */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:160px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day-h{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-family:var(--f-display);font-size:13px}
.day-b{padding:8px;display:flex;flex-direction:column;gap:8px}
.ev{border-radius:8px;padding:8px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:0}
.ev.concluido{opacity:.6}
.ev .hr{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.ev .who{color:var(--muted)}
.ev .btns{display:flex;flex-direction:column;gap:4px}
.ev .btns .btn{padding:5px 8px;font-size:11.5px;white-space:normal;justify-content:flex-start;text-align:left;width:100%}
.ev .who,.ev a.t{overflow-wrap:anywhere}
.btn{max-width:100%}
.todo-i .row .btn{white-space:normal;text-align:left}
.ev a.t{color:var(--fg);font-weight:600;text-decoration:none;cursor:pointer}
@media (max-width:1100px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}}

/* painel */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:4px}
.bar .vl{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12.5px;min-width:44px}
.trend{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px;border-bottom:1px solid var(--line);position:relative}
.trend .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.trend .cols{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.trend .c1,.trend .c2{width:42%;max-width:16px;border-radius:3px 3px 0 0;min-height:1px}
.trend .c1{background:var(--accent)} .trend .c2{background:var(--muted);opacity:.5}
.trend-l{display:flex;gap:6px}
.trend-l span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-family:var(--f-mono);min-width:0;overflow:hidden}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* drawer */
.ovl{position:fixed;inset:0;background:rgba(10,15,12,.4);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:var(--surface);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dr-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:2}
.dr-b{padding:18px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:5px}
.tl-i{position:relative;padding:0 0 14px 16px;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-i .w{color:var(--muted);font-size:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos a{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre.raw{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0;overflow-wrap:anywhere}

/* calendário mensal (início) */
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-w{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-d{border:0;background:none;border-radius:8px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg);font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--surface-2)}
.cal-d .n{width:28px;height:28px;line-height:28px;border-radius:50%;font-size:13.5px}
.cal-d.fora{color:var(--muted);opacity:.5}
.cal-d.sel{background:var(--accent-soft)}
.cal-d.hoje .n{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal-d .dots{display:flex;gap:2px;height:5px}
.cal-d .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-d .dots i.f{background:var(--muted);opacity:.5}
.cal-dia{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cal-ev{border:0;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:7px 9px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;font-size:13px;color:var(--fg)}
.cal-ev:hover{background:var(--accent-soft)}
.cal-ev .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev .muted{grid-column:2;font-size:12px}
.cal-ev.feita{border-left-color:var(--line)}
.cal-ev .mono{color:var(--accent);font-size:12px}

/* busca global */
.busca{position:relative;max-width:560px}
.busca .in{padding-left:34px;background:var(--surface)}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.busca-r{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:30;max-height:60vh;overflow:auto}

  dbState:"conectando",qFiles:[],qBusy:false,qCtl:null,draft:null,drawer:null,drawerMode:null,edit:null,
  chF:{st:"abertos",emp:"",cat:"",q:""},agSem:0,painelPer:"90",cadTab:"emp",cadEmp:"",rep:{mes:"",emp:""},repResumo:{},names:{},pending:false};

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const pad=n=>String(n).padStart(2,"0");
const isoDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hojeISO=()=>isoDate(new Date());
const parseD=s=>{if(!s)return null;const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const localDay=ts=>ts?isoDate(new Date(ts)):"";
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDias=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}):""};
const fmtDia=s=>{const d=parseD(s);return d?d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"}):""};
const fmtTs=ts=>ts?new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const digits=s=>String(s??"").replace(/\D/g,"");
const fmtTel=s=>{const d=digits(s).replace(/^55(?=\d{10,11}$)/,"");if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return s||""};
function waLink(tel,msg){let d=digits(tel);if(d.length===10||d.length===11)d="55"+d;return "https://wa.me/"+(d||"")+(msg?"?text="+encodeURIComponent(msg):"")}
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
const nowTs=()=>new Date().toISOString();
const plural=(n,s,p)=>n===1?s:(p||s+"s");

function conf(){const c=S.cfg||{};return{construtora:c.construtora||"",confCli:c.confCli||TPL.confCli,lembCli:c.lembCli||TPL.lembCli,resp:c.resp||TPL.resp}}
const emp=id=>S.M.emp.get(id); const uni=id=>S.M.uni.get(id); const resp=id=>S.M.resp.get(id); const chm=id=>S.M.ch.get(id);
const uniLabel=u=>u?((u.bloco?`Bl. ${u.bloco} · `:"")+(u.numero||"—")):"—";
function chTitulo(c){const e=emp(c.empId),u=uni(c.uniId);return (e?e.nome:"Sem empreendimento")+" · "+uniLabel(u)}
function statusPill(s){const x=STATUS[s]||STATUS.aberto;return `<span class="pill c-${x.c}">${x.l}</span>`}
function idadeCh(c){const fim=c.status==="resolvido"&&c.resolvidoEm?localDay(c.resolvidoEm):hojeISO();return Math.max(0,diffDias(localDay(c.abertoEm),fim))}
function garantia(c){
  const e=emp(c.empId);if(!e||!e.dataEntrega)return{k:"nd",l:"Garantia: informe a data de entrega do empreendimento"};
  const gid=(c.garItem&&GAR_MAP.has(c.garItem))?c.garItem:GAR_CAT[c.cat];
  if(!gid)return{k:"nd",l:c.cat==="Infiltração"?"Garantia: quando a causa da infiltração for identificada (impermeabilização, esquadria, fachada, tubulação…), escolha o item da NBR 15575 em Editar":"Garantia: defina o item da NBR 15575 em Editar"};
  const g=GAR_MAP.get(gid);const anos=garAnos(gid);const fim=parseD(e.dataEntrega);fim.setMonth(fim.getMonth()+Math.round(anos*12));
  const ab=new Date(c.abertoEm||Date.now());const desc=`${garCurto(g)} (${anos} ${plural(anos,"ano")})${c.garItem?"":" · estimado pela categoria"}`;
  return ab<=fim?{k:"ok",l:`Na garantia até ${fim.toLocaleDateString("pt-BR")} · ${desc}`}:{k:"bad",l:`Fora da garantia desde ${fim.toLocaleDateString("pt-BR")} · ${desc}`};
}
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
function jaPassou(a){const h=hojeISO();return a.data<h||(a.data===h&&(a.hora||"23:59")<agoraHM())}
function realizada(a){return a.status==="concluido"||(a.status==="marcado"&&jaPassou(a))}
function pendente(a){return a.status==="marcado"&&!jaPassou(a)}
function perguntaFim(c){
  if(c.status==="resolvido")return false;if(c.adiarAte&&c.adiarAte>hojeISO())return false;
  const vs=S.ag.filter(a=>a.chId===c.id&&a.status!=="cancelado");
  return vs.length>0&&!vs.some(pendente);
}
function ultimaVisita(chId){return S.ag.filter(a=>a.chId===chId&&realizada(a)).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora))[0]}
const AGUARDA=["Material","Cliente","Fornecedor / prestador","Síndico / condomínio","Orçamento / aprovação","Outro"];
function aguardandoAtivo(c){return c.status==="aguardando"&&!!c.aguardoAte&&c.aguardoAte>hojeISO()}
function semPasso(c){
  if(c.status==="resolvido")return false;if(c.adiarAte&&c.adiarAte>hojeISO())return false;
  if(S.ag.some(a=>a.chId===c.id&&pendente(a)))return false;if(perguntaFim(c))return false;if(aguardandoAtivo(c))return false;return true;
}
function equipe(){const e=(S.cfg&&S.cfg.equipe)||[];return e.length?e:["Flávia"]}
function eu(){try{return localStorage.getItem("pv-eu")||""}catch(e){return ""}}
function setEu(n){try{localStorage.setItem("pv-eu",n)}catch(e){}}
function diaRoteiro(){for(let i=1;i<=4;i++){const d=isoDate(addDays(new Date(),i));if(S.ag.some(a=>a.data===d&&pendente(a)&&a.respId))return d}return null}
function msgRoteiro(r,dia,vis){
  const cf=conf();const dd=diffDias(hojeISO(),dia);
  const linhas=vis.map(a=>{const c=chm(a.chId)||{};const u=uni(c.uniId)||{};const e=emp(c.empId)||{};
    const prob=[c.cat,c.amb].filter(Boolean).join(" – ")+(c.desc&&!incompleto(c)?": "+String(c.desc).slice(0,90):"");
    const cli=[(c.cli||u.prop||"").split(" ").slice(0,2).join(" "),fmtTel(c.tel||u.tel)].filter(Boolean).join(" ");
    return `\n*${a.hora||"--:--"}* · ${e.nome||""} · ${uniLabel(u)}${e.endereco?"\n   "+e.endereco:""}\n   ${TIPO[a.tipo]||"Visita"}${prob?" · "+prob:""}${cli?"\n   Cliente: "+cli:""}`}).join("\n");
  return `Olá, ${r.nome}! Roteiro de ${dd===0?"hoje":dd===1?"amanhã":fmtDia(dia)} (${fmtD(dia)}) – Pós-Venda${cf.construtora?" "+cf.construtora:""}:\n${linhas}\n\nQualquer imprevisto, me avise por aqui. Obrigada!`;
}
function tarefasHoje(){
  const h=hojeISO();const meus=S.hojeMeus&&eu();const filt=c=>!meus||(c&&c.respInt===eu());
  const diaR=diaRoteiro();const rots=[];
  for(const dia of [h,diaR].filter((x,i,a)=>x&&a.indexOf(x)===i)){
    const por={};S.ag.filter(a=>a.data===dia&&pendente(a)&&a.respId).forEach(a=>(por[a.respId]=por[a.respId]||[]).push(a));
    for(const [rid,lista] of Object.entries(por)){const pend=lista.some(precisaResp);if(dia===h&&!pend)continue;
      rots.push({dia,rid,r:resp(rid)||{nome:"Responsável"},vis:lista.sort((a,b)=>(a.hora||"").localeCompare(b.hora||"")),pend})}
  }
  rots.sort((a,b)=>(b.pend-a.pend)||a.dia.localeCompare(b.dia));
  const clis=S.ag.filter(a=>pendente(a)&&precisaCli(a)&&filt(chm(a.chId))).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const fins=S.ch.filter(c=>perguntaFim(c)&&filt(c)).map(c=>({c,u:ultimaVisita(c.id)})).sort((x,y)=>((x.u||{}).data||"").localeCompare((y.u||{}).data||""));
  const pr={urgente:0,alta:1,normal:2,baixa:3};
  const passos=S.ch.filter(c=>semPasso(c)&&filt(c)).sort((a,b)=>((pr[a.prio]??2)-(pr[b.prio]??2))||String(a.abertoEm).localeCompare(String(b.abertoEm)));
  return{rots,clis,fins,passos,total:rots.filter(r=>r.pend).length+clis.length+fins.length+passos.length};
}
function proxVisita(chId){const h=hojeISO();return S.ag.filter(a=>a.chId===chId&&a.status==="marcado"&&a.data>=h).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora))[0]}
function parado(c){if(c.status==="resolvido")return false;if(S.ag.some(a=>a.chId===c.id&&pendente(a)))return false;if(perguntaFim(c))return false;return diffDias(localDay(c.atualizadoEm||c.abertoEm),hojeISO())>=7}
function nome(id){return id?(S.names[id]||""):""}
async function resolveNames(ids){
  if(!S.user)return;const falta=[...new Set(ids.filter(i=>i&&!(i in S.names)))];if(!falta.length)return;
  falta.forEach(i=>S.names[i]="");
  try{const ps=await S.user.profiles(falta);let mudou=false;for(const i of falta){const n=ps[i]&&ps[i].name||"";if(n){S.names[i]=n;mudou=true}}if(mudou){S.drawer&&renderDrawer()}}catch(e){}
}
function toast(msg,acao){const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(msg)}</span>`;
  if(acao){const b=document.createElement("button");b.textContent=acao.l;b.onclick=()=>{acao.fn();t.remove()};t.appendChild(b)}
  $("#toasts").appendChild(t);setTimeout(()=>t.remove(),acao?(acao.t||7000):4000)}

/* ================= banco de dados ================= */
function col(k){return S.db.collection(COLS[k])}
async function dbAdd(k,data){if(!S.db)throw{code:"no_db"};const ref=col(k).doc();await ref.set(data);return ref.id}
async function dbUpd(k,id,data){if(!S.db)throw{code:"no_db"};await col(k).doc(id).update(data)}
async function dbDel(k,id){if(!S.db)throw{code:"no_db"};await col(k).doc(id).delete()}
function dbErr(e){
  const c=e&&e.code;
  if(c==="no_db")return toast("Sem conexão com o banco de dados. Abra o sistema pelo site, com login.");
  if(c==="invalid_argument")return toast("Você não tem permissão para alterar os dados deste sistema.");
  if(c==="quota_exceeded")return toast("O banco de dados está cheio. Fale com a administradora do sistema.");
  toast("Não consegui salvar agora. Tente de novo em instantes.");
}
function subscribe(){
  let timer=setTimeout(()=>{if(Object.keys(S.loaded).length<6){S.dbState="lento";renderBanner()}},10000);
  const done=()=>{if(Object.keys(S.loaded).length>=6){clearTimeout(timer);if(S.dbState!=="ok"){S.dbState="ok";renderBanner()}}};
  for(const [k,path] of Object.entries(COLS)){
    S.db.collection(path).onSnapshot(snap=>{
      S[k]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      S.M[k]=new Map(S[k].map(x=>[x.id,x]));
      if(!snap.metadata.fromCache)S.loaded[k]=true;done();scheduleRender();
    },err=>{S.loaded[k]=true;S.dbState="erro";renderBanner()});
  }
  S.db.doc("config/geral").onSnapshot(snap=>{S.cfg=snap.exists?snap.data():{};if(!snap.metadata.fromCache)S.loaded.cfg=true;done();scheduleRender()},()=>{S.loaded.cfg=true});
}
let rq=0;
function scheduleRender(){if(rq||S.pausaRender)return;rq=requestAnimationFrame(()=>{rq=0;renderNav();renderView();if(S.drawer&&!S.drawerMode&&!focusIn("#drawer-root"))renderDrawer()})}
function focusIn(sel){const a=document.activeElement,r=$(sel);return !!(a&&r&&r.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}

/* ================= navegação ================= */
function renderNav(){
  const abertos=S.ch.filter(c=>c.status!=="resolvido").length;
  const amanha=isoDate(addDays(new Date(),1));
  const cnt={chamados:abertos,inicio:tarefasHoje().total};
  const html=VIEWS.map(v=>`<button data-a="go" data-v="${v.id}" ${S.view===v.id?'aria-current="page"':""}>${ICON(v.i)}<span>${v.l}</span>${cnt[v.id]?`<span class="count">${cnt[v.id]}</span>`:""}</button>`).join("");
  $("#nav").innerHTML=html;
  $("#bnav").innerHTML=VIEWS.map(v=>`<button data-a="go" data-v="${v.id}" ${S.view===v.id?'aria-current="page"':""}>${ICON(v.i)}<span>${v.l}</span></button>`).join("");
  const db=diasSemBackup();const avisoBkp=S.dl&&S.loaded.cfg&&(db===null||db>7);
  $("#side-foot").innerHTML=`${avisoBkp?`<div class="bkp-side"><b>${db===null?"Sem cópia de segurança":`Última cópia há ${db} dias`}</b><button class="btn sm" data-a="bkp-go">Baixar cópia</button></div>`:""}${S.emp.length?`<div>${S.emp.length} ${plural(S.emp.length,"empreendimento")} · ${S.uni.length} ${plural(S.uni.length,"unidade")}</div>`:""}`;
}
function go(v,push=true){
  if(!VIEWS.some(x=>x.id===v)&&v!=="preencher")v="inicio";
  if(S.drawer&&v!==S.view)closeDrawer();
  S.view=v;S.edit=null;document.body.dataset.tela=v;
  if(push&&location.hash!=="#"+v){try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}}
  $("#quick-sec").hidden=v!=="inicio";
  renderNav();renderView(true);window.scrollTo(0,0);
}
function renderBanner(){
  const el=$("#sys-banner");let h="";
  if(!S.db&&S.dbState==="sem")h=`<div class="banner c-warn">Não consegui ligar ao banco do site. Recarregue a página; se continuar, saia e entre de novo no site.</div>`;
  else if(S.dbState==="lento")h=`<div class="banner c-warn">Ainda não consegui carregar os dados. Verifique a conexão; a página continua tentando.</div>`;
  else if(S.dbState==="erro")h=`<div class="banner c-bad">Perdi a conexão com o banco de dados. Recarregue a página.</div>`;
  el.innerHTML=h;
}

/* ================= render principal ================= */
function renderView(force){
  if(!force&&(S.edit||focusIn("#view"))){S.pending=true;return}
  S.pending=false;
  const f={inicio:vInicio,chamados:vChamados,agenda:vAgenda,painel:vPainel,relatorios:vRelatorios,cadastros:vCadastros,preencher:vPreencher}[S.view];
  $("#view").innerHTML=f();
  if(S.view==="chamados")renderChList();
}
document.addEventListener("focusout",()=>{if(S.pending)setTimeout(()=>{if(S.pending)renderView()},350)});

/* ================= INÍCIO ================= */
function precisaCli(a){const dd=diffDias(hojeISO(),a.data);if(!a.confCli)return true;if(dd<=1&&!a.lembCli&&localDay(a.confCli)<isoDate(addDays(parseD(a.data),-1)))return true;return false}
function precisaResp(a){const dd=diffDias(hojeISO(),a.data);if(!a.confResp)return true;if(dd<=1&&!a.lembResp&&localDay(a.confResp)<isoDate(addDays(parseD(a.data),-1)))return true;return false}
function renderQuick(){
  const sec=$("#quick-sec");
  sec.innerHTML=`
  <div class="top"><div><div class="eyebrow">${esc(new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}))}</div><h1>Registro rápido</h1>

  $("#q-text").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();organizar()}});

function renderThumbs(){$("#q-thumbs").innerHTML=S.qFiles.map((f,i)=>`<div class="thumb"><img src="${f.url}" alt="Anexo ${i+1}"><button data-a="q-rm" data-i="${i}" aria-label="Remover anexo">×</button></div>`).join("")}
function addFiles(fs){for(const f of fs){if(S.qFiles.length>=8)break;S.qFiles.push({file:f,url:URL.createObjectURL(f)})}renderThumbs()}
function calMes(){
  const h=hojeISO();const base=S.calMes||new Date(new Date().getFullYear(),new Date().getMonth(),1);const sel=S.calDia||h;
  const dirC=S.calDir;S.calDir=null;
  const anima=dirC===1?"desliza-dir":dirC===-1?"desliza-esq":"";
  const hj=new Date();const longe=base.getMonth()!==hj.getMonth()||base.getFullYear()!==hj.getFullYear()||sel!==h;
  const ini=addDays(base,-base.getDay());const dias=[...Array(42)].map((_,i)=>addDays(ini,i));
  const ult=dias[35].getMonth()!==base.getMonth()?dias.slice(0,35):dias;
  const porDia={};S.ag.forEach(a=>{if(a.status!=="cancelado")(porDia[a.data]=porDia[a.data]||[]).push(a)});
  const evs=(porDia[sel]||[]).slice().sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const titulo=base.toLocaleDateString("pt-BR",{month:"long"});
  return `<div class="card cal"><div class="card-h"><h2><span class="cal-mv ${anima}" style="display:inline-block;text-transform:capitalize">${esc(titulo)}</span> <span class="muted" style="font-weight:500">${base.getFullYear()}</span></h2>
   <div class="row" style="gap:4px"><button class="btn sm" data-a="cal-prev" aria-label="Mês anterior">‹</button><button class="btn sm${longe?" pri":""}" data-a="cal-hoje">${longe?"Voltar para hoje":"Hoje"}</button><button class="btn sm" data-a="cal-next" aria-label="Próximo mês">›</button></div></div>
   <div class="cal-g ${anima}">${["D","S","T","Q","Q","S","S"].map(d=>`<span class="cal-w">${d}</span>`).join("")}
   ${ult.map(d=>{const iso=isoDate(d);const l=porDia[iso]||[];const fora=d.getMonth()!==base.getMonth();
     const dots=l.slice(0,3).map(a=>`<i class="${realizada(a)?"f":""}"></i>`).join("");
     return `<button class="cal-d ${fora?"fora":""} ${iso===h?"hoje":""} ${iso===sel?"sel":""}" data-a="cal-dia" data-d="${iso}" aria-label="${esc(fmtDia(iso))}, ${l.length} ${plural(l.length,"visita")}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`}).join("")}</div>
   <div class="cal-dia"><div class="row" style="justify-content:space-between"><b>${esc(fmtDia(sel))}</b><button class="btn ghost sm" data-a="go" data-v="agenda">Agenda →</button></div>
   ${evs.length?evs.map(a=>{const c=chm(a.chId)||{};const r=resp(a.respId);return `<button class="cal-ev ${realizada(a)?"feita":""}" data-a="open-ch" data-id="${esc(a.chId)}"><span class="mono">${esc(a.hora||"--:--")}</span><span class="t">${esc(c.id?chTitulo(c):"Chamado removido")}</span><span class="muted">${esc(TIPO[a.tipo]||"")}${quem(a)?" · "+esc(quem(a)):""}</span></button>`}).join(""):`<div class="small muted">Nenhuma visita neste dia.</div>`}
   <div class="leg" style="margin-top:4px"><span><i style="background:var(--accent);border-radius:50%"></i>marcada</span><span><i style="background:var(--muted);border-radius:50%;opacity:.5"></i>realizada</span></div></div></div>`;
}
function vInicio(){
  const h=hojeISO();const T=tarefasHoje();
  const sec=(tit,n,hint,body)=>n?`<div class="hj-sec"><h3>${tit} <span class="n">${n}</span></h3>${hint?`<div class="hint">${hint}</div>`:""}${body}</div>`:"";
  const tit=c=>`<a class="t" data-a="open-ch" data-id="${esc(c.id)}">${esc(c.id?chTitulo(c):"Chamado removido")}</a>`;
  const sRot=sec("Roteiros dos prestadores",T.rots.filter(r=>r.pend).length||(T.rots.length?"✓":0),"Uma mensagem por prestador com todas as visitas do dia.",

function entIso(d){return isoDate(d)}
function entDesloc(n){return isoDate(addDays(new Date(),n))}
// Datas no texto: devolve todas (com posição) — hoje/amanhã/dia da semana/dd/mm/"dia 12"/mês por extenso
function entDatas(f){
  const out=[];const hoje=new Date();const add=(data,m,kind)=>out.push({data,i:m.index,j:m.index+m[0].length,kind});
  let m;
  const re1=/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g;
  while((m=re1.exec(f))){const dd=+m[1],mm=+m[2];if(dd<1||dd>31||mm<1||mm>12)continue;let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):hoje.getFullYear();
    if(!m[3]){const t=new Date(y,mm-1,dd);if(t-hoje>200*864e5)y--;}   // "28/10" dito em novembro = este ano; "15/01" dito em novembro = próximo? só volta um ano se ficar longe demais no futuro
    add(`${y}-${pad(mm)}-${pad(dd)}`,m,"data")}
  const reRel=/\b(depois de amanha|amanha|hoje|ontem)\b/g;
  while((m=reRel.exec(f)))add(entDesloc({"depois de amanha":2,amanha:1,hoje:0,ontem:-1}[m[1]]),m,"rel");
  const reDia=/\b(?:(?:na|no|nesta|neste|nessa|nesse|proxima|proximo|prox\.?)\s+)?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira| feira)?\b/g;
  while((m=reDia.exec(f))){let delta=(ENT_DIAS[m[1]]-hoje.getDay()+7)%7;if(delta===0)delta=7;add(entDesloc(delta),m,"semana")}
  const reD=/\bdia (\d{1,2})\b(?!\/)/g;
  while((m=reD.exec(f))){const dd=+m[1];if(dd<1||dd>31)continue;let t=new Date(hoje.getFullYear(),hoje.getMonth(),dd);if(dd<hoje.getDate())t=new Date(hoje.getFullYear(),hoje.getMonth()+1,dd);add(isoDate(t),m,"dia")}

  while((m=reM.exec(f))){const mi=ENT_MESES.indexOf(m[1]);let y=hoje.getFullYear();if(mi>hoje.getMonth())y--;add(`${y}-${pad(mi+1)}-01`,m,"mes")}
  return out.sort((a,b)=>a.i-b.i);
}
function entHora(f){

}
function entTelefone(f){
  const re=/(?:\+?55\s*)?\(?\d{2}\)?[\s.]*9?[\s.]*\d{4}[\s.-]?\d{4}/g;let m;
  while((m=re.exec(f))){const d=m[0].replace(/\D/g,"");if(d.length>=10&&d.length<=13)return{tel:d.replace(/^55(?=\d{10,11}$)/,""),i:m.index,j:m.index+m[0].length}}

function entEmp(f){

    const re=new RegExp("\\b(?:residencial\\s+)?(?:ilhas?\\s+(?:de|do|dos|da|das)\\s+)?"+k.replace(/\s+/g,"\\s+")+"\\b");const m=f.match(re);

function entUnidade(f,cortes){

  const respObj=rp?{id:rp.id,nome:rp.nome,especialidade:rp.esp,telefone:""}:{id:null,nome:"",especialidade:"",telefone:""};

  let desc=entLimpa(linha,cortes);if(ag)desc=desc.replace(/[\s,;:-]*\b(vistoria|visita|retorno)\b[\s,.]*$/i,"");
  if(desc.length<4)duv.push("descreva o problema");

    cliente:{nome:cliM?cliM[1]:(extra.cli||""),telefone:tel?tel.tel:(extra.tel||"")},categoria:cat,garantiaItem:entGarantia(f,cat),ambiente:entAmbiente(f)||(ENT_AREA.some(([n])=>n===uniNum)?uniNum:""),

// Conversa copiada do WhatsApp: "[16:14, 10/11/2026] 1204 Campeche Daiana: Boa tarde" ou "10/11/2026 16:14 - Nome: msg"
function entWhatsApp(txt){
  const L=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const msgs=[];
  const r1=/^\[(\d{1,2}:\d{2}),?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\]\s*([^:]{1,60}):\s*(.*)$/,r2=/^(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s*(\d{1,2}:\d{2})\s*-\s*([^:]{1,60}):\s*(.*)$/;
  for(const l of L){let m=l.match(r1);if(m){msgs.push({data:m[2],quem:m[3].trim(),txt:m[4]});continue}m=l.match(r2);if(m){msgs.push({data:m[1],quem:m[3].trim(),txt:m[4]});continue}if(msgs.length)msgs[msgs.length-1].txt+=" "+l}
  if(msgs.length<2)return null;
  const daCasa=q=>/sbj|pos.?venda|arquitetura|engenharia|construtora|flavia|giovanna/i.test(fk(q));
  const cliMsgs=msgs.filter(m=>!daCasa(m.quem));const quem=(cliMsgs[0]||msgs[0]).quem;
  const d0=(cliMsgs[0]||msgs[0]).data.split("/");const y=d0[2].length===2?"20"+d0[2]:d0[2];
  const corpo=cliMsgs.map(m=>m.txt.replace(/^\s*(bom dia|boa tarde|boa noite|ol[aá]|oi|tudo bem)[!,.?\s]*/i,"").trim()).filter(t=>t&&!/^(tudo bem|obrigad[oa])[!.?\s]*$/i.test(t)).filter(t=>!/^(<m[ií]dia oculta>|imagem|v[ií]deo|audio|áudio|figurinha|‎)/i.test(t.trim())).join(". ");
  return{quem,corpo,dataAb:`${y}-${pad(+d0[1])}-${pad(+d0[0])}`};
}
function entender(txt){
  const r={acao:"novo",chamadoId:null,chamados:[],agendamento:null,solucao:"",nota:"",duvidas:[],atualizacoes:[]};
  txt=String(txt||"").trim();if(!txt)return r;
  const wa=entWhatsApp(txt);
  if(wa){
    // o nome do contato costuma ser "1204 Campeche Daiana": prédio, unidade e cliente saem dele
    const fq=fk(wa.quem);const eb=entEmp(fq);const un=entUnidade(fq,[]);
    let nome=wa.quem;if(eb)nome=nome.slice(0,eb.i)+nome.slice(eb.j);if(un)nome=nome.replace(new RegExp("\\b"+un.numero+"\\b","i"),"");nome=nome.replace(/\s+/g," ").trim();
    const it=entItem(wa.corpo||txt,{empId:eb?eb.e.id:null,empNome:eb?eb.e.nome:"",numero:un?un.numero:"",cli:nome,dataAb:wa.dataAb});
    if(!it.item.empreendimento.id&&eb){it.item.empreendimento={id:eb.e.id,nome:eb.e.nome}}
    if(!it.item.unidade.numero&&un)it.item.unidade.numero=un.numero;
    if(!it.item.cliente.nome)it.item.cliente.nome=nome;
    it.item.dataAbertura=wa.dataAb;
    r.chamados=[it.item];r.duvidas=it.duv.filter(d=>!(d==="qual empreendimento?"&&eb)&&!(d==="qual unidade?"&&un));
    r.duvidas.push("conversa do WhatsApp: confira a descrição");
    return r;
  }
  // #12 ou unidade com chamado aberto → ações no chamado existente (texto de uma linha)
  const linhas=txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^[^\d]{0,40}:$/.test(l)&&(/\d/.test(l)||l.split(/\s+/).length>2));
  const itens=linhas.map(l=>entItem(l));
  const abertoDa=(it)=>{const id=it.item.empreendimento.id||acharEmp(null,it.item.empreendimento.nome);if(!id||!it.item.unidade.numero)return [];
    const u=S.uni.find(x=>x.empId===id&&norm(x.numero)===norm(it.item.unidade.numero));if(!u)return [];
    return S.ch.filter(c=>c.uniId===u.id&&c.status!=="resolvido").sort((a,b)=>(b.num||0)-(a.num||0))};
  if(itens.length===1){
    const it=itens[0];const mNum=txt.match(/#\s?(\d{1,5})/);let alvo=mNum?S.ch.find(c=>String(c.num)===mNum[1]):null;
    const abertos=abertoDa(it);if(!alvo&&abertos.length)alvo=abertos.find(c=>c.cat===it.item.categoria&&!incompleto(c))||(it.temProblema&&!it.acaoResolver&&!it.item.agendamento?abertos.find(incompleto):null)||abertos.find(c=>!incompleto(c)&&it.acaoResolver)||abertos[0];
    if(alvo&&alvo.status!=="resolvido"){
      const f=it.f;
      if(it.acaoResolver){r.acao="resolver";r.chamadoId=alvo.id;r.solucao=it.item.descricao.replace(/^(resolvid[oa]|conclu[ií]d[oa]|finalizad[oa]|terminou|terminad[oa]|pronto|encerrad[oa])\b[\s,.:;\-–]*/i,"").replace(/^./,x=>x.toUpperCase())||"Resolvido";return r}
      if(it.item.agendamento&&(/\b(agendar|marcar|agendad|marcad|visita|vistoria|vai|vem|volta)\b/.test(f)||!it.temProblema||it.item.categoria===alvo.cat)){r.acao="agendar";r.chamadoId=alvo.id;r.agendamento=it.item.agendamento;return r}
      if(/^\s*(obs|observacao|nota|anotar|anotacao)\b/.test(f)){r.acao="nota";r.chamadoId=alvo.id;r.nota=it.item.descricao.replace(/^(obs|observa[cç][aã]o|nota|anotar|anota[cç][aã]o)\s*[:\-]?\s*/i,"");return r}
      if(incompleto(alvo)&&it.temProblema){r.acao="completar";r.atualizacoes=[{chamadoId:alvo.id,categoria:it.item.categoria,garantiaItem:it.item.garantiaItem,ambiente:it.item.ambiente,descricao:it.item.descricao,cliente:it.item.cliente,unidadeOrigem:it.item.unidadeOrigem}];return r}
    }
  }else{
    // várias linhas: se a maioria aponta para chamados importados sem descrição, completa esses
    const alvos=itens.map(it=>(abertoDa(it).find(c=>incompleto(c))||null));
    if(alvos.filter(Boolean).length>=Math.ceil(itens.length/2)){
      r.acao="completar";itens.forEach((it,k)=>{const c=alvos[k];if(!c){r.duvidas.push(`linha ${k+1} não corresponde a um chamado aberto sem descrição`);return}
        r.atualizacoes.push({chamadoId:c.id,categoria:it.item.categoria,garantiaItem:it.item.garantiaItem,ambiente:it.item.ambiente,descricao:it.item.descricao,cliente:it.item.cliente,unidadeOrigem:it.item.unidadeOrigem})});
      return r;
    }
  }
  r.chamados=itens.map(it=>it.item);
  const dv=new Set();itens.forEach((it,k)=>it.duv.forEach(d=>dv.add(itens.length>1?`linha ${k+1}: ${d}`:d)));r.duvidas=[...dv].slice(0,8);
  return r;
}

function capturarReview(){
  const d=S.draft;if(!d)return;
  if($("#rv0-desc")){d.itens.forEach((it,i)=>{const p="rv"+i;if(!$("#"+p+"-desc"))return;
    const inc=$("#"+p+"-inc");it.inc=inc?inc.checked:true;
    const es=val(p+"-emp");it.empId=es==="__novo"?"":es;it.empNome=es==="__novo"?val(p+"-empnovo"):"";
    it.num=val(p+"-num");it.bloco=val(p+"-bloco");it.cli=val(p+"-cli");it.tel=digits(val(p+"-tel"));
    it.cat=val(p+"-cat");it.amb=val(p+"-amb");it.prio=val(p+"-prio");it.st=val(p+"-st");
    it.data=val(p+"-ab")||hojeISO();it.origemUni=val(p+"-orig");it.garItem=val(p+"-gar");it.desc=val(p+"-desc");it.andamento=val(p+"-and");
    it.agOn=!!$("#"+p+"-agon").checked;it.ag=lerAgD(p)})}
  (d.upd||[]).forEach((u,i)=>{const p="cp"+i;if(!$("#"+p+"-desc"))return;u.inc=$("#"+p+"-inc").checked;u.cat=val(p+"-cat");u.amb=val(p+"-amb");u.desc=val(p+"-desc");u.cli=val(p+"-cli");u.tel=digits(val(p+"-tel"));u.origemUni=val(p+"-orig");u.garItem=val(p+"-gar")});
  if($("#rv-ch"))d.chId=val("rv-ch")||d.chId;
  if($("#rv-data"))d.ag=lerAgD("rv");
  if($("#rv-sol"))d.sol=val("rv-sol");if($("#rv-nota"))d.nota=val("rv-nota");
}
function juntarItens(){
  capturarReview();const d=S.draft;const its=d.itens.filter(i=>i.inc);if(its.length<2)return;
  const base=Object.assign({},its[0]);
  const uniq=a=>[...new Set(a.filter(Boolean))];
  base.amb=uniq(its.map(i=>i.amb)).join(", ");
  base.desc=its.map(i=>i.desc).filter(Boolean).join(" ");
  base.andamento=uniq(its.map(i=>i.andamento)).join(" ");
  base.data=its.map(i=>i.data).sort()[0];
  const ordem={urgente:0,alta:1,normal:2,baixa:3};base.prio=its.map(i=>i.prio).sort((a,b)=>ordem[a]-ordem[b])[0];
  const comAg=its.find(i=>i.agOn);if(comAg){base.agOn=true;base.ag=comAg.ag}
  base.feitas=its.flatMap(i=>i.feitas||[]);
  d.itens=[base];renderReview();
}
async function ensureEmp(id,nomeE,ctx){
  if(id&&emp(id))return id;const n=norm(nomeE);if(!n)return "";
  if(ctx&&ctx.emp[n])return ctx.emp[n];
  const ex=S.emp.find(e=>norm(e.nome)===n);if(ex)return ex.id;
  const nid=await dbAdd("emp",{nome:nomeE.trim(),status:"entregue",dataEntrega:"",endereco:"",criadoEm:nowTs()});
  if(ctx)ctx.emp[n]=nid;return nid;
}
async function ensureUni(empId,num,bloco,cli,tel,ctx){
  if(!empId||!num)return "";
  const key=empId+"|"+norm(num)+"|"+norm(bloco);if(ctx&&ctx.uni[key])return ctx.uni[key];
  const ex=S.uni.find(u=>u.empId===empId&&norm(u.numero)===norm(num)&&norm(u.bloco)===norm(bloco));
  if(ex){const up={};if(cli&&!ex.prop)up.prop=cli;if(tel&&!ex.tel)up.tel=tel;if(Object.keys(up).length)await dbUpd("uni",ex.id,up);if(ctx)ctx.uni[key]=ex.id;return ex.id}
  const nid=await dbAdd("uni",{empId,numero:num.trim(),bloco:(bloco||"").trim(),prop:cli||"",tel:tel||"",criadoEm:nowTs()});
  if(ctx)ctx.uni[key]=nid;return nid;
}
async function ensureResp(a,ctx){
  if(a.respId&&resp(a.respId))return a.respId;const n=norm(a.respNome);if(!n)return "";
  if(ctx&&ctx.resp&&ctx.resp[n])return ctx.resp[n];
  const ex=S.resp.find(r=>norm(r.nome)===n);if(ex)return ex.id;
  const nid=await dbAdd("resp",{nome:a.respNome.trim(),esp:a.respEsp||"",tel:a.respTel||"",criadoEm:nowTs()});
  if(ctx){ctx.resp=ctx.resp||{};ctx.resp[n]=nid}return nid;
}
async function registrarFeita(chId,a,ctx){
  const respId=await ensureResp(a,ctx);const t=nowTs();
  if(!respId&&a.cargo)await ensureCargo(a.cargo);
  await dbAdd("ag",{chId,data:a.data,hora:a.hora||"",tipo:a.tipo||"execucao",respId,cargo:respId?"":(a.cargo||""),status:"concluido",confCli:t,lembCli:t,confResp:t,lembResp:t,retroativa:true,criadoEm:t});
  return respId;
}
async function uploadFotos(files){
  const ids=[];if(!S.assets||!files.length)return ids;
  for(const f of files){try{const r=await S.assets.upload(f.file);ids.push(r.id)}catch(e){toast("Uma das fotos não pôde ser salva.")}}
  return ids;
}
const hist=(k,txt)=>({t:nowTs(),k,txt,por:S.uid||""});
function tsDoDia(iso){if(!iso||iso===hojeISO())return nowTs();const d=parseD(iso);d.setHours(12,0,0,0);return d.toISOString()}
async function criarVisita(chId,a,ctx){
  if(a.data&&a.data<hojeISO()){const rid=await registrarFeita(chId,a,ctx);const r=resp(rid);return `Visita já realizada em ${fmtD(a.data)}${a.hora?" às "+a.hora:""}${r?" com "+r.nome:(a.respNome?" com "+a.respNome:"")} registrada na agenda`}
  const respId=await ensureResp(a,ctx);
  if(!respId&&a.cargo)await ensureCargo(a.cargo);
  await dbAdd("ag",{chId,data:a.data,hora:a.hora||"",tipo:a.tipo||"vistoria",respId,cargo:respId?"":(a.cargo||""),status:"marcado",confCli:"",lembCli:"",confResp:"",lembResp:"",criadoEm:nowTs()});
  const r=resp(respId);return `${TIPO[a.tipo]||"Visita"} marcada para ${fmtD(a.data)}${a.hora?" às "+a.hora:""}${r?" com "+r.nome:(a.respNome?" com "+a.respNome:(a.cargo?" ("+a.cargo+")":""))}`;
}
async function salvarReview(){
  capturarReview();const d=S.draft;const btn=$("#rv-save");
  if(d.acao==="completar"){
    const us=d.upd.filter(u=>u.inc);if(!us.length)return toast("Marque pelo menos um chamado.");
    btn.disabled=true;btn.textContent="Salvando…";
    try{for(const u of us){const c=chm(u.chId);if(!c)continue;
        await dbUpd("ch",c.id,{cat:u.cat,amb:u.amb,desc:u.desc||c.desc,cli:u.cli,tel:u.tel,origemUni:u.origemUni,garItem:u.garItem||"",atualizadoEm:nowTs(),hist:[...(c.hist||[]),hist("edicao","Dados do chamado completados")]});
        const un=uni(c.uniId);if(un){const up={};if(u.cli&&!un.prop)up.prop=u.cli;if(u.tel&&!un.tel)up.tel=u.tel;if(Object.keys(up).length)await dbUpd("uni",un.id,up)}}
      S.draft=null;$("#q-text").value="";renderReview();
      const falta=S.ch.filter(incompleto).length;
      toast(`${us.length} ${plural(us.length,"chamado completado","chamados completados")}${falta?` · faltam ${falta}`:""}`);
    }catch(e){dbErr(e);btn.disabled=false;btn.textContent="Salvar"}
    return;
  }
  const its=d.acao==="novo"?d.itens.filter(i=>i.inc):[];
  if(d.acao==="novo"){
    if(!its.length)return toast("Marque pelo menos um chamado.");
    for(const [k,it] of its.entries()){const qual=its.length>1?` (chamado ${d.itens.indexOf(it)+1})`:"";
      if(!it.empId&&!it.empNome)return toast("Escolha ou informe o empreendimento"+qual+".");
      if(!it.desc)return toast("Descreva o problema"+qual+".");
      if(it.agOn&&!it.ag.data)return toast("Informe a data da visita"+qual+".");}
  }else{
    if(!d.chId)return toast("Escolha o chamado.");
    if(d.acao==="agendar"&&!d.ag.data)return toast("Informe a data da visita.");
    if(d.acao==="resolver"&&!d.sol)return toast("Conte o que foi feito para resolver.");
    if(d.acao==="nota"&&!d.nota)return toast("Escreva a observação.");
  }
  btn.disabled=true;btn.textContent="Salvando…";
  try{
    const fotos=await uploadFotos(S.qFiles);let msg,abrir;
    if(d.acao==="novo"){
      const ctx={emp:{},uni:{},resp:{}};let num=Math.max(0,...S.ch.map(c=>Number(c.num)||0));const nums=[];
      for(const it of its){
        const empId=await ensureEmp(it.empId,it.empNome,ctx);
        const uniId=await ensureUni(empId,it.num,it.bloco,it.cli,it.tel,ctx);
        num++;nums.push(num);const ab=tsDoDia(it.data);
        const h=[{t:ab,k:"abertura",txt:"Chamado aberto",por:S.uid||""}];
        if(it.data!==hojeISO())h.push(hist("nota","Cadastrado no sistema em "+fmtD(hojeISO())));
        if(it.andamento)h.push(hist("nota","Andamento: "+it.andamento));
        let st=it.st||"aberto";if(it.agOn&&st==="aberto")st="agendado";
        const chId=await dbAdd("ch",{respInt:eu()||"",num,empId,uniId,cli:it.cli,tel:it.tel,cat:it.cat,amb:it.amb,desc:it.desc,prio:it.prio,status:st,abertoEm:ab,atualizadoEm:nowTs(),
          resolvidoEm:st==="resolvido"?nowTs():"",sol:st==="resolvido"?(it.andamento||""):"",fotos,origem:(d.raw||"").slice(0,4000),origemUni:it.origemUni||"",garItem:it.garItem||"",hist:h});
        const h2=[...h];
        if(it.feitas&&it.feitas.length){for(const fv of it.feitas)await registrarFeita(chId,fv,ctx);
          h2.push(hist("visita",`${it.feitas.length} ${plural(it.feitas.length,"visita já realizada registrada","visitas já realizadas registradas")} na agenda: ${it.feitas.map(f=>fmtD(f.data)).join(", ")}`))}
        if(it.agOn)h2.push(hist("visita",await criarVisita(chId,it.ag,ctx)));
        if(h2.length>h.length)await dbUpd("ch",chId,{hist:h2});
        abrir=abrir||chId;
      }
      msg=nums.length>1?`${nums.length} chamados criados (#${nums[0]} a #${nums[nums.length-1]})`:`Chamado #${nums[0]} criado`;
      if(nums.length>1)abrir=null;
    }else{
      const c=chm(d.chId);const h=[...(c.hist||[])];const up={atualizadoEm:nowTs()};
      if(fotos.length)up.fotos=[...(c.fotos||[]),...fotos];
      if(d.acao==="agendar"){h.push(hist("visita",await criarVisita(d.chId,d.ag)));if(c.status!=="resolvido"&&d.ag.data>=hojeISO())up.status="agendado"}
      if(d.acao==="resolver"){up.status="resolvido";up.resolvidoEm=nowTs();up.sol=d.sol;h.push(hist("resolvido","Resolvido: "+d.sol))}
      if(d.acao==="nota"){h.push(hist("nota",d.nota))}
      if(d.raw)h[h.length-1]=Object.assign({},h[h.length-1],{origem:d.raw.slice(0,2000)});
      up.hist=h;await dbUpd("ch",d.chId,up);abrir=d.chId;
      msg={agendar:`Visita agendada no chamado #${c.num}`,resolver:`Chamado #${c.num} resolvido`,nota:`Observação salva no #${c.num}`}[d.acao];
    }
    S.draft=null;S.qFiles=[];$("#q-text").value="";renderThumbs();renderReview();
    toast(msg,abrir?{l:"Abrir",fn:()=>openCh(abrir)}:{l:"Ver chamados",fn:()=>go("chamados")});

function filtrarCh(){

    if(f.ri){const ri=c.respInt||"";if(f.ri==="__meus"?ri!==eu():f.ri==="__sem"?!!ri:ri!==f.ri)return false}
    if(q){const u=uni(c.uniId)||{};const hay=norm([c.num,chTitulo(c),c.cli,u.prop,c.desc,c.amb,c.cat,c.sol,c.origemUni].join(" "));if(!q.split(" ").every(w=>hay.includes(w)))return false}
    return true}).sort((a,b)=>{const o=f.ord||"prio";const rec=(b.abertoEm||"").localeCompare(a.abertoEm||"")||(b.num||0)-(a.num||0);

/* ================= BUSCA GLOBAL ================= */
function buscar(q){
  const n=norm(q);if(n.length<2)return[];const toks=n.split(" ").filter(Boolean);const dq=digits(q);const res=[];
  const mnum=n.match(/^#?(\d{1,4})$/);
  if(mnum){S.ch.filter(c=>String(c.num)===mnum[1]).forEach(c=>res.push({k:"ch",id:c.id,t:`Chamado #${c.num} · ${chTitulo(c)}`,d:`${c.cat||""} — ${String(c.desc||"").slice(0,70)}`}))}
  for(const u of S.uni){
    const e=emp(u.empId)||{};
    const hay=norm([u.numero,u.bloco,e.nome,curto(e.nome||""),u.prop].join(" "));
    const okTxt=toks.every(t=>hay.includes(t));
    const okTel=dq.length>=6&&(digits(u.tel).includes(dq)||digits(u.contatos).includes(dq));
    if(okTxt||okTel){const nc=S.ch.filter(c=>c.uniId===u.id).length;
      res.push({k:"uni",id:u.id,t:`${e.nome||""} · ${uniLabel(u)}`,d:[u.prop,u.tel?fmtTel(u.tel):"",nc?`${nc} ${plural(nc,"chamado")}`:""].filter(Boolean).join(" · ")});
      if(res.length>=12)break}
  }
  return res.slice(0,12);
}
function renderBusca(){
  const q=$("#busca").value;const box=$("#busca-r");const r=buscar(q);
  if(!q.trim()){box.hidden=true;return}
  box.innerHTML=r.length?r.map(x=>`<button data-a="${x.k==="ch"?"busca-ch":"busca-uni"}" data-id="${esc(x.id)}"><div class="t">${esc(x.t)}</div><div class="d">${esc(x.d)}</div></button>`).join(""):`<div class="small muted" style="padding:10px 12px">Nada encontrado. Tente número + prédio (ex.: 1104 Malta), nome ou telefone.</div>`;
  box.hidden=false;
}

async function drAction(a){
  const c=chm(S.drawer&&S.drawer.id);if(!c)return;const h=[...(c.hist||[])];
  try{
    if(a==="dr-ag-save"){const ag=lerAg("dr");if(!ag.data)return toast("Informe a data da visita.");const fut=ag.data>=hojeISO();h.push(hist("visita",await criarVisita(c.id,ag)));await dbUpd("ch",c.id,{hist:h,status:fut&&c.status!=="resolvido"?"agendado":c.status,atualizadoEm:nowTs()});toast(fut?"Visita agendada":"Visita registrada como já realizada")}
    if(a==="dr-feita-save"){const ag=lerAg("df");if(!ag.data)return toast("Informe a data da visita.");if(ag.data>hojeISO())return toast("Essa data ainda não chegou. Use Agendar visita.");
      const ctx={resp:{}};const rid=await registrarFeita(c.id,ag,ctx);const r=resp(rid);
      h.push(hist("visita",`Visita já realizada em ${fmtD(ag.data)}${ag.hora?" às "+ag.hora:""}${r?" com "+r.nome:(ag.respNome?" com "+ag.respNome:"")} registrada na agenda`));
      await dbUpd("ch",c.id,{hist:h,atualizadoEm:nowTs()});
      S.feitaRef=Object.assign({},ag,{respId:rid||ag.respId,respNome:rid?"":ag.respNome,data:""});
      toast(`Visita de ${fmtD(ag.data)} registrada. Pode lançar a próxima.`);renderDrawer();const f=$("#df-data");f&&f.focus();return}
    if(a==="dr-res-save"){const sol=val("dr-sol");if(!sol)return toast("Conte o que foi feito.");h.push(hist("resolvido","Resolvido: "+sol));await dbUpd("ch",c.id,{hist:h,status:"resolvido",sol,resolvidoEm:nowTs(),atualizadoEm:nowTs()});toast(`Chamado #${c.num} resolvido`)}
    if(a==="dr-nota-save"){const n=val("dr-nota");if(!n)return toast("Escreva a observação.");h.push(hist("nota",n));await dbUpd("ch",c.id,{hist:h,atualizadoEm:nowTs()})}
    if(a==="dr-reabrir"){h.push(hist("reaberto","Chamado reaberto"));await dbUpd("ch",c.id,{hist:h,status:"aberto",resolvidoEm:"",atualizadoEm:nowTs()})}
    if(a==="dr-edit-save"){
      const empId=val("de-emp")||c.empId;const num=val("de-num"),bloco=val("de-bloco");const cli=val("de-cli"),tel=digits(val("de-tel"));
      let uniId=c.uniId;const u=uni(c.uniId);
      if(num&&(!u||u.empId!==empId||norm(u.numero)!==norm(num)||norm(u.bloco)!==norm(bloco)))uniId=await ensureUni(empId,num,bloco,cli,tel);
      const st=val("de-st");const up={empId,uniId,cli,tel,cat:val("de-cat"),amb:val("de-amb"),prio:val("de-prio"),desc:val("de-desc"),status:st,atualizadoEm:nowTs()};
      if($("#de-sol"))up.sol=val("de-sol");
      up.origemUni=val("de-orig");up.garItem=val("de-gar");const ab=val("de-ab");if(ab&&ab!==localDay(c.abertoEm))up.abertoEm=tsDoDia(ab);
      if(st==="resolvido"&&c.status!=="resolvido")up.resolvidoEm=nowTs();if(st!=="resolvido")up.resolvidoEm="";
      h.push(hist("edicao","Dados do chamado editados"));up.hist=h;await dbUpd("ch",c.id,up);toast("Alterações salvas")}
    if(a==="dr-agu-save"){const que=val("agu-que"),obs=val("agu-obs"),ate=val("agu-ate");if(!ate)return toast("Informe a data.");
      const q=que+(obs?": "+obs:"");h.push(hist("nota",`Aguardando ${q} até ${fmtD(ate)}`));
      await dbUpd("ch",c.id,{status:"aguardando",aguardoQue:q,aguardoAte:ate,hist:h,atualizadoEm:nowTs()});toast(`Volta para "Hoje" em ${fmtD(ate)}`)}
    if(a==="dr-obra-save"){const txt=val("ob-txt"),res=val("ob-res");const rid=val("ob-resp");
      if(!txt&&res!=="resolvido")return toast("Conte o que foi visto ou feito.");
      await registrarFeita(c.id,{data:hojeISO(),hora:agoraHM(),tipo:"vistoria",respId:rid,respNome:""},{resp:{}});
      h.push(hist("visita",`Visita de ${fmtD(hojeISO())}${resp(rid)?" com "+resp(rid).nome:""}: ${txt||"sem observações"}`));
      const up={hist:h,atualizadoEm:nowTs()};
      if(res==="resolvido"){up.status="resolvido";up.resolvidoEm=nowTs();up.sol=txt||c.sol||"Resolvido na visita de "+fmtD(hojeISO())}
      else if(c.status==="agendado"&&!S.ag.some(x=>x.chId===c.id&&pendente(x)))up.status="aberto";
      await dbUpd("ch",c.id,up);
      if(res==="aguardando"){S.drawerMode="aguardar";renderDrawer();toast("Visita salva. Agora diga o que está aguardando.");return}
      toast(res==="resolvido"?`Chamado #${c.num} resolvido`:"Visita registrada")}
    if(a==="dv-save"||a==="dv-del-ok"){
      const vid=arguments[1];const v=S.M.ag.get(vid);if(!v)return;let txt;
      if(a==="dv-del-ok"){await dbDel("ag",vid);txt=`Visita de ${fmtD(v.data)} excluída`;S.visDel=null}
      else{const ag=lerAg("dv");if(!ag.data)return toast("Informe a data.");const st=val("dv-st")||"marcado";
        const respId=ag.novoResp?await ensureResp(ag):ag.respId;
        if(!respId&&ag.cargo)await ensureCargo(ag.cargo);
        const up={data:ag.data,hora:ag.hora,tipo:ag.tipo,respId,cargo:respId?"":(ag.cargo||""),status:st};
        if(ag.data!==v.data||ag.hora!==(v.hora||"")||respId!==v.respId)Object.assign(up,{confCli:"",lembCli:"",confResp:"",lembResp:""});
        await dbUpd("ag",vid,up);const r=resp(respId);
        txt=`Visita alterada: ${fmtD(ag.data)}${ag.hora?" às "+ag.hora:""} · ${TIPO[ag.tipo]||"Visita"}${r?" · "+r.nome:(ag.cargo?" · "+ag.cargo:"")}${st==="cancelado"?" · cancelada":st==="concluido"?" · realizada":""}`}
      const outras=S.ag.filter(x=>x.chId===c.id&&x.id!==vid);
      const temPend=outras.some(pendente)||(a==="dv-save"&&val("dv-st")==="marcado"&&val("dv-data")>=hojeISO());
      const st2=c.status==="resolvido"?c.status:(temPend?"agendado":(c.status==="agendado"?"aberto":c.status));
      h.push(hist("visita",txt));await dbUpd("ch",c.id,{hist:h,status:st2,atualizadoEm:nowTs()});toast(a==="dv-del-ok"?"Visita excluída":"Visita atualizada")}
    if(a==="dr-del-ok"){const vis=S.ag.filter(x=>x.chId===c.id);closeDrawer();S.pausaRender=true;try{await Promise.all(vis.map(ag=>dbDel("ag",ag.id)));await dbDel("ch",c.id)}finally{S.pausaRender=false;scheduleRender()}toast(`Chamado #${c.num} excluído`);return}
    S.drawerMode=null;renderDrawer();
  }catch(e){dbErr(e)}
}

function agCalendario(semana){
  const dirMes=S.agMesDir;S.agMesDir=null;
  const nova=S.agCalNovo;S.agCalNovo=false;
  const m=S.agMes||new Date(),ano=m.getFullYear(),mes=m.getMonth();
  const primeiro=new Date(ano,mes,1);
  const ini=addDays(primeiro,-((primeiro.getDay()+6)%7));
  const hoje=hojeISO();
  const anima=dirMes===1?"desliza-dir":dirMes===-1?"desliza-esq":"";
  let celulas="";
  for(let k=0;k<42;k++){
    const d=addDays(ini,k),iso=isoDate(d);
    const cls=["ag-cd",d.getMonth()!==mes?"fora":"",iso===hoje?"hoje":"",semana.includes(iso)?"sem":""].filter(Boolean).join(" ");
    celulas+=`<button type="button" class="${cls}" data-a="ag-cal-dia" data-d="${iso}">${d.getDate()}</button>`;
  }
  const nomeMes=primeiro.toLocaleDateString("pt-BR",{month:"long"});
  return `<div class="ag-cal${nova?" abre":""}" role="dialog" aria-label="Escolher data">
    <div class="ag-cal-h"><button type="button" class="btn ghost sm" data-a="ag-cal-prev" aria-label="Mês anterior">‹</button><div class="ag-cal-mv ${anima}"><b>${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)} ${ano}</b></div><button type="button" class="btn ghost sm" data-a="ag-cal-next" aria-label="Próximo mês">›</button></div>
    <div class="ag-cal-sem">${["seg","ter","qua","qui","sex","sáb","dom"].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="ag-cal-g ${anima}">${celulas}</div>
    <div class="ag-cal-f"><button type="button" class="btn ghost sm" data-a="ag-hoje">Esta semana</button><button type="button" class="btn ghost sm" data-a="ag-pick">Fechar</button></div>
  </div>`;
}
function agEscolheData(v){
  if(!v)return;
  const seg=d=>addDays(d,-((d.getDay()+6)%7));
  const alvo=parseD(v),hoje=new Date();
  const diff=Math.round((seg(alvo)-seg(hoje))/(7*86400000));
  S.agDir=diff>S.agSem?1:diff<S.agSem?-1:0;
  S.agSem=diff;S.agPick=false;renderView(true);
}
function vAgenda(){
  const dirAg=S.agDir;S.agDir=null;
  const base=addDays(new Date(),S.agSem*7);const ini=addDays(base,-((base.getDay()+6)%7));
  const dias=[...Array(7)].map((_,i)=>isoDate(addDays(ini,i)));const h=hojeISO();
  const nova=S.edit&&S.edit.kind==="ag-new";
  const diasVis=dias.filter(d=>{const w=parseD(d).getDay();return (w!==0&&w!==6)||d===h||S.ag.some(a=>a.data===d&&a.status!=="cancelado")});
  const fimLabel=parseD(dias[6]).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  return `<div class="top"><div><h1>Agenda</h1><div class="sub">${parseD(dias[0]).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} a ${fimLabel}</div></div>

/* ================= PAINEL ================= */
function periodoIni(p){if(p==="tudo")return "0000-00-00";return isoDate(addDays(new Date(),-Number(p)))}
function contar(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function barras(lista,max){if(!lista.length)return `<div class="muted small">Sem dados no período.</div>`;const mx=max||Math.max(...lista.map(x=>x[1]));
  return `<div class="bars">${lista.map(([l,v])=>`<div class="bar"><span class="lb" title="${esc(l)}">${esc(l)}</span><span class="tr"><span class="fl" style="display:block;width:${Math.max(2,v/mx*100)}%"></span></span><span class="vl">${v}</span></div>`).join("")}</div>`}
function vPainel(){
  const ini=periodoIni(S.painelPer);const chs=S.ch.filter(c=>localDay(c.abertoEm)>=ini);
  const res=S.ch.filter(c=>c.status==="resolvido"&&c.resolvidoEm&&localDay(c.resolvidoEm)>=ini);
  const tm=res.length?(res.reduce((s,c)=>s+idadeCh(c),0)/res.length):0;
  const fora=chs.filter(c=>garantia(c).k==="bad").length;
  const porEmp=contar(chs,c=>(emp(c.empId)||{}).nome||"Sem empreendimento");
  const porCat=contar(chs,c=>c.cat);
  // mapa de calor empreendimento x categoria
  const empsH=porEmp.slice(0,15).map(x=>x[0]);const catsH=porCat.map(x=>x[0]);
  const mat={};chs.forEach(c=>{const e=(emp(c.empId)||{}).nome||"Sem empreendimento";mat[e+"|"+c.cat]=(mat[e+"|"+c.cat]||0)+1});
  const mxH=Math.max(1,...Object.values(mat));
  // tendência 12 meses
  const meses=[];const d0=new Date();d0.setDate(1);for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);meses.push(d.getFullYear()+"-"+pad(d.getMonth()+1))}
  const ab=meses.map(m=>S.ch.filter(c=>localDay(c.abertoEm).startsWith(m)).length);const rs=meses.map(m=>S.ch.filter(c=>c.resolvidoEm&&localDay(c.resolvidoEm).startsWith(m)).length);
  const mxT=Math.max(1,...ab,...rs);
  // reincidência
  const porUni=contar(S.ch,c=>c.uniId).filter(x=>x[1]>1).slice(0,8);
  // responsáveis
  const vis=S.ag.filter(a=>a.data>=ini&&a.respId);const porResp=contar(vis,a=>a.respId).slice(0,8);
  const nomeP={"30":"últimos 30 dias","90":"últimos 90 dias","365":"últimos 12 meses","tudo":"todo o período"}[S.painelPer];
  return `<div class="top"><div><h1>Painel</h1><div class="sub">Onde estão os problemas · ${nomeP}</div></div>
   <div class="seg" role="group" aria-label="Período">${[["30","30 dias"],["90","90 dias"],["365","12 meses"],["tudo","Tudo"]].map(([k,l])=>`<button data-a="pn-per" data-p="${k}" aria-pressed="${S.painelPer===k}">${l}</button>`).join("")}</div></div>
  ${!S.ch.length?`<div class="empty"><b>O painel se monta sozinho</b>Assim que os primeiros chamados forem registrados, aparecem aqui os empreendimentos e os tipos de problema mais frequentes.</div>`:""}
  <div class="kpis">
    <div class="kpi"><span class="v">${chs.length}</span><span class="l">chamados abertos no período</span></div>
    <div class="kpi"><span class="v">${res.length}</span><span class="l">resolvidos no período</span></div>
    <div class="kpi"><span class="v">${tm?tm.toFixed(1).replace(".",","):"–"}</span><span class="l">dias em média até resolver</span></div>
    <div class="kpi"><span class="v">${S.ch.filter(c=>c.status!=="resolvido").length}</span><span class="l">em aberto agora${fora?` · ${fora} fora da garantia`:""}</span></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Por empreendimento</h2></div>${barras(porEmp.slice(0,12))}</div>
    <div class="card"><div class="card-h"><h2>Por tipo de problema</h2></div>${barras(porCat)}</div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Infiltrações por causa</h2><span class="small muted">pelo item de garantia</span></div>${barras(contar(chs.filter(c=>c.cat==="Infiltração"),c=>c.garItem&&GAR_MAP.has(c.garItem)?garCurto(GAR_MAP.get(c.garItem)):"Causa não identificada"))}</div>
    <div class="card"><div class="card-h"><h2>Unidades × áreas comuns</h2></div>${barras(contar(chs,c=>ehAreaComum(uni(c.uniId))?"Áreas comuns":"Unidades privativas"))}
      <div class="small muted" style="margin-top:8px">${S.ch.filter(c=>c.status!=="resolvido"&&garantia(c).k==="bad").length} ${plural(S.ch.filter(c=>c.status!=="resolvido"&&garantia(c).k==="bad").length,"chamado aberto está","chamados abertos estão")} fora da garantia.</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Mapa de problemas</h2><span class="small muted">Empreendimento × tipo · quanto mais escuro, mais chamados</span></div>
   ${empsH.length?`<div class="tbl-wrap" style="border:0"><table class="heat"><thead><tr><th>Empreendimento</th>${catsH.map(c=>`<th style="text-align:center;white-space:normal;min-width:70px">${esc(c)}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>
   ${empsH.map(e=>`<tr><td style="white-space:nowrap">${esc(e)}</td>${catsH.map(c=>{const v=mat[e+"|"+c]||0;const p=Math.round(v/mxH*85);return `<td class="h" style="background:${v?`color-mix(in srgb, var(--accent) ${p+10}%, var(--surface))`:"transparent"};color:${p>45?"var(--accent-fg)":"var(--fg)"}">${v||""}</td>`}).join("")}<td class="n"><b>${porEmp.find(x=>x[0]===e)[1]}</b></td></tr>`).join("")}</tbody></table></div>`:`<div class="muted small">Sem dados no período.</div>`}
  </div>
  <div class="card"><div class="card-h"><h2>Evolução mensal</h2><div class="leg"><span><i style="background:var(--accent)"></i>Abertos</span><span><i style="background:var(--muted);opacity:.5"></i>Resolvidos</span></div></div>
   <div class="trend">${meses.map((m,i)=>`<div class="m" title="${m}: ${ab[i]} abertos, ${rs[i]} resolvidos"><div class="cols"><div class="c1" style="height:${ab[i]/mxT*100}%"></div><div class="c2" style="height:${rs[i]/mxT*100}%"></div></div></div>`).join("")}</div>
   <div class="trend-l">${meses.map((m,i)=>`<span>${new Date(m+"-02").toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}<br>${ab[i]}/${rs[i]}</span>`).join("")}</div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Unidades reincidentes</h2><span class="small muted">2 ou mais chamados</span></div>
     ${porUni.length?`<div class="list">${porUni.map(([id,n])=>{const u=uni(id);if(!u)return "";const cats=[...new Set(S.ch.filter(c=>c.uniId===id).map(c=>c.cat))];return `<button class="li" data-a="open-uni" data-id="${esc(id)}"><span class="num">${n}×</span><span style="min-width:0"><div class="t">${esc((emp(u.empId)||{}).nome||"")} · ${esc(uniLabel(u))}</div><div class="d">${esc(cats.join(", "))}</div></span><span></span></button>`}).join("")}</div>`:`<div class="muted small">Nenhuma unidade com mais de um chamado.</div>`}</div>
    <div class="card"><div class="card-h"><h2>Responsáveis mais acionados</h2></div>${barras(porResp.map(([id,n])=>[(resp(id)||{}).nome||"—",n]))}</div>
  </div>`;
}

function repDados(){
  const mes=S.rep.mes||hojeISO().slice(0,7);const empF=S.rep.emp;
  const base=S.ch.filter(c=>!empF||c.empId===empF);
  const novos=base.filter(c=>localDay(c.abertoEm).startsWith(mes));
  const resolv=base.filter(c=>c.resolvidoEm&&localDay(c.resolvidoEm).startsWith(mes));
  const fimMes=isoDate(new Date(Number(mes.slice(0,4)),Number(mes.slice(5,7)),0));
  const abertosFim=base.filter(c=>localDay(c.abertoEm)<=fimMes&&(!c.resolvidoEm||localDay(c.resolvidoEm)>fimMes));
  const tm=resolv.length?resolv.reduce((s,c)=>s+idadeCh(c),0)/resolv.length:0;
  const visitas=S.ag.filter(a=>a.data.startsWith(mes)&&a.status==="concluido"&&(!empF||(chm(a.chId)||{}).empId===empF)).length;
  return{mes,empF,novos,resolv,abertosFim,tm,visitas,porEmp:contar(novos,c=>(emp(c.empId)||{}).nome||"Sem empreendimento"),porCat:contar(novos,c=>c.cat),
    titulo:"Relatório de Pós-Venda · "+new Date(mes+"-02").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+(empF?" · "+((emp(empF)||{}).nome||""):"")};
}

function resumoAuto(D){
  const mesNome=new Date(D.mes+"-02").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  if(D.porEmp.length)f.push(`O empreendimento com mais chamados foi ${D.porEmp[0][0]} (${D.porEmp[0][1]}).`);
  if(D.porCat.length)f.push(`O tipo de problema mais frequente foi ${D.porCat[0][0].toLowerCase()} (${D.porCat[0][1]}).`);
  if(D.tm)f.push(`Os chamados resolvidos levaram em média ${D.tm.toFixed(1).replace(".",",")} dias.`);

}

const FORN_API="/api/pos-obra/fornecedores";
async function fornCarregar(){
  try{
    const r=await fetch(FORN_API,{credentials:"include",cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    S.forn=(j.registros||[]).sort((a,b)=>String(a.nomeFantasia||a.razaoSocial||"").localeCompare(String(b.nomeFantasia||b.razaoSocial||""),"pt"));
    S.fornErro=null;
  }catch(e){S.forn=[];S.fornErro="Não consegui carregar os fornecedores. Recarregue a página.";}
  S.fornCarregando=false;
  renderView(true);
}

async function fornGravar(id){
  const val=i=>((document.getElementById(i)||{}).value||"").trim();
  const editando=id&&id!=="__new";
  const base=editando?(S.forn.find(f=>f.id===id)||{}):{};
  const reg={...base,id:editando?id:"sup"+Date.now().toString(36),nomeFantasia:val("cf-nome"),razaoSocial:val("cf-razao"),cnpj:val("cf-cnpj"),telefone:val("cf-tel"),email:val("cf-email"),status:val("cf-st")||"ativo"};
  if(!reg.nomeFantasia&&!reg.razaoSocial)return toast("Informe o nome do fornecedor.");
  try{

/* ---------- importação de backup (clientes e prédios) ---------- */
function extrairCel(s){
  const re=/(?:\(?\d{2}\)?[\s.]*)?\d[\d.\s-]{6,12}\d/g;let m;const t=String(s||"");
  while((m=re.exec(t))){const d=m[0].replace(/\D/g,"");
    if(d.length===11&&d[2]==="9")return d;
    if(d.length===10&&"6789".includes(d[2]))return d.slice(0,2)+"9"+d.slice(2);
    if(d.length===9&&d[0]==="9")return "47"+d;
    if(d.length===8&&"6789".includes(d[0]))return "479"+d;}
  return "";
}
const slugify=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const curto=nome=>norm(nome).replace(/^residencial /,"").replace(/^ilhas? (de |do |dos |da |das )?/,"");
function prepararBackup(j){
  if(!j||!Array.isArray(j.buildings)||!Array.isArray(j.clients))throw new Error("formato");
  const emps=j.buildings.map(b=>{const nome=String(b.name||"").replace(/^residencial\s+/i,"").trim();
    const ex=S.emp.find(e=>norm(e.nome)===norm(nome)||curto(e.nome)===curto(nome));
    return{key:b.id,nome,status:b.status==="andamento"?"obra":"entregue",endereco:String(b.address||"").trim(),
      dataEntrega:/^\d{4}-\d{2}-\d{2}/.test(b.deliveryDate||"")?b.deliveryDate.slice(0,10):"",existId:ex?ex.id:"",id:ex?ex.id:"emp-"+slugify(curto(nome))}}).filter(e=>e.nome);
  const porKey=new Map(emps.map(e=>[e.key,e]));const unis=new Map();
  for(const c of j.clients){const e=porKey.get(c.buildingId);const numero=String(c.unit||"").trim();
    if(!e||!numero||numero.length>20||!/[0-9a-z]/i.test(numero))continue;
    const k=e.id+"|"+norm(numero);const esc2=String(c.escritura||"").trim();
    const reg={empId:e.id,numero,prop:String(c.name||"").trim(),contatos:String(c.phone||"").trim(),tel:extrairCel(c.phone)||extrairCel(esc2),
      email:String(c.email||"").trim(),garagem:String(c.garage||"").trim(),obs:[c.notes,(esc2&&esc2!=="Sim"&&esc2!==c.phone)?esc2:""].filter(Boolean).join(" · ")};
    if(unis.has(k)){const u=unis.get(k);u.prop=[u.prop,reg.prop].filter(Boolean).join(" / ");u.contatos=[u.contatos,reg.contatos].filter(Boolean).join(" / ");u.tel=u.tel||reg.tel;continue}
    const ex=S.uni.find(u=>u.empId===e.id&&norm(u.numero)===norm(numero)&&!u.bloco);
    reg.existId=ex?ex.id:"";reg.id=ex?ex.id:"uni-"+slugify(curto(e.nome))+"-"+slugify(numero);unis.set(k,reg)}
  const us=[...unis.values()];

async function executarImport(){
  const P=S.imp.plano;const t=nowTs();
  const tarefas=[];
  for(const e of P.emps){
    if(e.existId){const cur=emp(e.existId)||{};const up={status:e.status};if(e.endereco&&!cur.endereco)up.endereco=e.endereco;if(e.dataEntrega&&!cur.dataEntrega)up.dataEntrega=e.dataEntrega;tarefas.push(()=>dbUpd("emp",e.existId,up))}
    else tarefas.push(()=>S.db.collection(COLS.emp).doc(e.id).set({nome:e.nome,status:e.status,endereco:e.endereco,dataEntrega:e.dataEntrega,criadoEm:t}));
  }
  const tarefasU=P.unis.map(u=>()=>{
    if(u.existId){const cur=uni(u.existId)||{};const up={contatos:u.contatos,email:u.email,garagem:u.garagem};if(u.obs)up.obs=u.obs;if(!cur.prop&&u.prop)up.prop=u.prop;if(!cur.tel&&u.tel)up.tel=u.tel;return dbUpd("uni",u.existId,up)}
    return S.db.collection(COLS.uni).doc(u.id).set({empId:u.empId,numero:u.numero,bloco:"",prop:u.prop,tel:u.tel,contatos:u.contatos,email:u.email,garagem:u.garagem,obs:u.obs,criadoEm:t});
  });
  S.imp.state="run";S.imp.feito=0;S.imp.erros=0;S.imp.total=tarefas.length+tarefasU.length;renderView(true);
  const rodar=async f=>{try{await f()}catch(e){if(e&&e.code==="unavailable"){try{await new Promise(r=>setTimeout(r,800));await f()}catch(e2){S.imp.erros++}}else S.imp.erros++}S.imp.feito++;if(S.imp.feito%20===0)renderView(true)};
  for(const f of tarefas)await rodar(f);
  for(let i=0;i<tarefasU.length;i+=6)await Promise.all(tarefasU.slice(i,i+6).map(rodar));
  S.imp.state="done";renderView(true);toast(`Importação concluída${S.imp.erros?` com ${S.imp.erros} erros`:""}`);
}
